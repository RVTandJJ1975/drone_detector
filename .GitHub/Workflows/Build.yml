
name: Build APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show what is in lib/main.dart
        run: |
          echo "===== FIRST 30 LINES OF lib/main.dart ====="
          head -n 30 lib/main.dart
          echo "==========================================="
          if grep -q "DroneDetectorApp" lib/main.dart; then
            echo "OK - Our Drone Detector code is present"
          else
            echo "ERROR - Demo code detected!"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android platform only
        run: |
          flutter create --project-name drone_detector --org com.example temp_app
          rm -rf android
          cp -r temp_app/android .
          rm -rf temp_app

      - name: Verify source still correct after create
        run: |
          echo "===== CHECKING lib/main.dart AGAIN ====="
          head -n 20 lib/main.dart
          grep -q "DroneDetectorApp" lib/main.dart || (echo "Source was overwritten!" && exit 1)

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (explicit target)
        run: flutter build apk --release -t lib/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drone-detector-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show main.dart
        run: head -n 25 lib/main.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Make android folder
        run: |
          flutter create --project-name drone_detector --org com.example temp_app
          rm -rf android
          cp -r temp_app/android .
          rm -rf temp_app
      - run: flutter pub get
      - run: flutter build apk --release -t lib/main.dart
      - uses: actions/upload-artifact@v4
        with:
          name: drone-detector-apk
          path: build/app/outputs/flutter-apk/app-release.apk

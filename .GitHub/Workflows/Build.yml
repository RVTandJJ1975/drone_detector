
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Backup our source
        run: |
          mkdir -p /tmp/our_source
          cp -r lib /tmp/our_source/
          cp pubspec.yaml /tmp/our_source/

      - name: Create Android platform files
        run: |
          flutter create --project-name drone_detector --org com.example --platforms=android .

      - name: Restore our source
        run: |
          rm -rf lib
          cp -r /tmp/our_source/lib .
          cp /tmp/our_source/pubspec.yaml .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drone-detector-apk
          path: build/app/outputs/flutter-apk/app-release.apk
